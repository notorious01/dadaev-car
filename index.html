<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Dadaev Car — прокат автомобилей в Махачкале. Прототип Telegram Mini App.">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { height: 100%; }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Dadaev Car</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: Telegram Mini App column (max 520px), sticky top bar with role switch, fixed bottom main button like Telegram's MainButton. */
:root {
  --bg: #f3f2ee;
  --surface: #ffffff;
  --surface-2: #e9e7e1;
  --fg: #17171a;
  --muted: #6c6a66;
  --line: #dcd9d2;
  --accent: #f2c230;
  --accent-ink: #17171a;
  --accent-text: #8a6a00;
  --ok: #1f8a52;
  --warn: #b7791f;
  --bad: #c2412d;
  --info: #2f6fb5;
  --busy: #d9d5cc;
  --font-display: "Russo One", "Arial Black", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0f11; --surface: #19191c; --surface-2: #232327; --fg: #f1efe9; --muted: #9a978f; --line: #2c2c31;
    --accent: #ffd353; --accent-ink: #17171a; --accent-text: #ffd353;
    --ok: #4cc98a; --warn: #e8b04a; --bad: #f0786a; --info: #79aef0; --busy: #34343a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0f11; --surface: #19191c; --surface-2: #232327; --fg: #f1efe9; --muted: #9a978f; --line: #2c2c31;
  --accent: #ffd353; --accent-ink: #17171a; --accent-text: #ffd353;
  --ok: #4cc98a; --warn: #e8b04a; --bad: #f0786a; --info: #79aef0; --busy: #34343a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 520px; margin: 0 auto; min-height: 100%; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.logo { width: 128px; height: 15px; background: var(--fg); -webkit-mask: url(img/logo.png) left center / contain no-repeat; mask: url(img/logo.png) left center / contain no-repeat; flex: none; }
.back { border: 0; background: var(--surface-2); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.top-title { font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.role { margin-left: auto; display: flex; background: var(--surface-2); border-radius: 999px; padding: 3px; flex: none; }
.role button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); }
.role button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.demo-note { font-size: 12px; color: var(--muted); padding-block: 0 8px; }

/* hero */
.hero { position: relative; margin-top: 12px; border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 10; max-width: 100%; background: var(--surface-2); }
.hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero-text { position: absolute; inset: auto 0 0 0; padding: 48px 16px 14px; background: linear-gradient(to top, rgb(0 0 0 / .78), rgb(0 0 0 / 0)); color: #fff; display: grid; gap: 4px; }
.hero h1 { font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.1; margin: 0; text-wrap: balance; }
.hero p { margin: 0; font-size: 13px; opacity: .9; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--muted); padding-block: 12px 4px; }
.facts b { color: var(--fg); font-weight: 600; }

/* chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 600; white-space: nowrap; flex: none; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* catalog */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 360px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.card { border: 0; padding: 0; text-align: left; background: var(--surface); border-radius: 14px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.thumb { aspect-ratio: 4 / 3; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; max-width: 100%; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.nophoto { font-family: var(--font-display); color: var(--muted); font-size: 13px; text-align: center; padding: 8px; }
.card-body { padding: 10px 12px 12px; display: grid; gap: 4px; align-content: start; }
.card-name { font-weight: 700; line-height: 1.25; }
.card-meta { font-size: 12px; color: var(--muted); }
.price { font-weight: 800; font-variant-numeric: tabular-nums; }
.price small { font-weight: 500; color: var(--muted); font-size: 12px; }
.avail { font-size: 12px; font-weight: 600; }
.avail.ok { color: var(--ok); } .avail.no { color: var(--bad); }

/* car page */
.gallery { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; margin-top: 12px; scrollbar-width: none; }
.gallery::-webkit-scrollbar { display: none; }
.gallery .shot { flex: 0 0 100%; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; scroll-snap-align: start; background: var(--surface-2); display: grid; place-items: center; max-width: 100%; }
.gallery.many .shot { flex-basis: 88%; }
.gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
h2 { font-size: 22px; line-height: 1.2; margin: 14px 0 4px; text-wrap: balance; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; font-weight: 700; }
.specs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; }
.specs div { background: var(--surface); padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.specs span { font-size: 12px; color: var(--muted); }
.specs b { font-weight: 600; }
.desc { color: var(--muted); font-size: 14px; margin: 10px 0 0; }

/* calendar */
.cal { background: var(--surface); border-radius: 14px; padding: 12px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-weight: 700; }
.cal-head button { border: 0; background: var(--surface-2); width: 32px; height: 32px; border-radius: 50%; }
.cal-head button:disabled { opacity: .35; cursor: default; }
.dow, .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center; }
.dow span { font-size: 11px; color: var(--muted); padding-block: 4px; text-transform: uppercase; }
.day { border: 0; background: transparent; height: 40px; border-radius: 8px; font-weight: 600; font-variant-numeric: tabular-nums; position: relative; }
.day:disabled { color: var(--muted); opacity: .4; cursor: default; }
.day.busy { background: var(--busy); color: var(--muted); text-decoration: line-through; opacity: 1; }
.day.in { background: color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 0; }
.day.start, .day.end { background: var(--accent); color: var(--accent-ink); }
.day.start { border-radius: 8px 0 0 8px; } .day.end { border-radius: 0 8px 8px 0; } .day.start.end { border-radius: 8px; }
.day.today::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: currentColor; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
.hint { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 1.4em; }
.hint.err { color: var(--bad); }

/* summary & form */
.sum { background: var(--surface); border-radius: 14px; padding: 4px 14px; }
.row { display: flex; justify-content: space-between; gap: 12px; padding-block: 10px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.row:first-child { border-top: 0; }
.row span:first-child { color: var(--muted); }
.row.total { font-weight: 800; font-size: 17px; }
.row.total span:first-child { color: var(--fg); }
.form { display: grid; gap: 12px; }
.field { display: grid; gap: 6px; }
.field label, .field .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font-size: 16px; }
.field textarea { resize: vertical; min-height: 70px; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 6px; font-size: 13px; font-weight: 600; line-height: 1.25; }
.seg button small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.seg button[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--fg); flex: none; }
.tg-phone { display: flex; gap: 8px; }
.tg-phone input { flex: 1; min-width: 0; }
.tg-phone button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 0 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.err-text { color: var(--bad); font-size: 13px; }

/* main button (Telegram MainButton look) */
.main-btn-wrap { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: linear-gradient(to top, var(--bg) 70%, transparent); padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-top: 18px; }
.main-btn-inner { max-width: 520px; margin: 0 auto; }
.main-btn { width: 100%; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 16px; padding: 15px; }
.main-btn:disabled { background: var(--surface-2); color: var(--muted); cursor: default; }

/* bookings & manager */
.list { display: grid; gap: 10px; }
.bk { background: var(--surface); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; border-left: 4px solid var(--line); }
.bk[data-s="new"] { border-left-color: var(--info); }
.bk[data-s="confirmed"] { border-left-color: var(--ok); }
.bk[data-s="issued"] { border-left-color: var(--warn); }
.bk[data-s="returned"] { border-left-color: var(--muted); }
.bk[data-s="declined"], .bk[data-s="cancelled"] { border-left-color: var(--bad); opacity: .8; }
.bk-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.bk-title { font-weight: 700; min-width: 0; }
.bk-meta { font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
.pill { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 9px; white-space: nowrap; background: var(--surface-2); }
.pill.new { color: var(--info); } .pill.confirmed { color: var(--ok); } .pill.issued { color: var(--warn); }
.pill.returned { color: var(--muted); } .pill.declined, .pill.cancelled { color: var(--bad); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 700; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.tabs { display: flex; gap: 4px; padding-block: 0 10px; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 10px; font-weight: 700; font-size: 14px; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); }
.count { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--info); color: #fff; font-size: 11px; margin-left: 4px; vertical-align: 1px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.stat { background: var(--surface); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; }
.stat b { font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }

/* bot message */
.botmsg { background: var(--surface); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; border: 1px solid var(--line); }
.botmsg-head { display: flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 700; }
.botmsg-head i { width: 26px; height: 26px; border-radius: 50%; background: var(--fg); display: grid; place-items: center; flex: none; }
.botmsg-head i::before { content: ""; width: 18px; height: 6px; background: var(--bg); -webkit-mask: url(img/logo.png) center / contain no-repeat; mask: url(img/logo.png) center / contain no-repeat; }
.botmsg pre { margin: 0; font: inherit; font-size: 14px; white-space: pre-wrap; }
.botmsg .actions .btn { flex: 1; }

/* board */
.board-wrap { overflow-x: auto; background: var(--surface); border-radius: 14px; }
.board { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
.board th, .board td { border-bottom: 1px solid var(--line); padding: 0; height: 34px; }
.board thead th { font-weight: 600; color: var(--muted); min-width: 34px; text-align: center; padding: 4px 0; line-height: 1.2; }
.board thead th.we { color: var(--bad); }
.board thead th.today { color: var(--fg); background: color-mix(in srgb, var(--accent) 25%, transparent); }
.board th.unit { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; padding: 0 10px; white-space: nowrap; font-weight: 600; color: var(--fg); border-right: 1px solid var(--line); }
.board th.unit small { display: block; color: var(--muted); font-weight: 500; }
.board td { position: relative; min-width: 34px; }
.cell { position: absolute; inset: 5px 0; }
.cell.confirmed { background: var(--ok); }
.cell.issued { background: var(--warn); }
.cell.new { background: repeating-linear-gradient(45deg, var(--info) 0 4px, transparent 4px 8px); opacity: .7; }
.cell.repair { background: repeating-linear-gradient(45deg, var(--muted) 0 3px, transparent 3px 7px); }
.cell.s { left: 3px; border-radius: 5px 0 0 5px; } .cell.e { right: 3px; border-radius: 0 5px 5px 0; }
.fleet-item { background: var(--surface); border-radius: 12px; padding: 10px 12px; display: flex; gap: 12px; align-items: center; }
.fleet-item .ph { width: 64px; height: 48px; border-radius: 8px; overflow: hidden; background: var(--surface-2); flex: none; }
.fleet-item .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fleet-item .info { flex: 1; min-width: 0; display: grid; gap: 2px; }
.fleet-item .info b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fleet-item .info span { font-size: 12px; color: var(--muted); }
.price-input { width: 84px; font: inherit; font-weight: 700; text-align: right; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 8px; padding: 6px 8px; font-variant-numeric: tabular-nums; }
.switch { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.switch input { accent-color: var(--bad); width: 18px; height: 18px; }

.success { text-align: center; display: grid; gap: 10px; justify-items: center; padding-block: 36px 12px; }
.success .mark { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 30px; font-weight: 800; }
.success h2 { margin: 0; }
.success p { margin: 0; color: var(--muted); max-width: 36ch; }
.empty { text-align: center; color: var(--muted); padding: 32px 12px; background: var(--surface); border-radius: 14px; }
.foot { font-size: 12px; color: var(--muted); padding-block: 24px 8px; display: grid; gap: 4px; }
.toast { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 20; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgb(0 0 0 / .25); }
@media (prefers-reduced-motion: no-preference) {
  .view { animation: in .18s ease-out; }
  @keyframes in { from { transform: translateY(6px); } to { transform: none; } }
}
</style>

</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="gut">

  <main class="gut view" id="view"></main>
</div>
<div class="main-btn-wrap gut" id="mainBtnWrap" hidden>
  <div class="main-btn-inner"><button class="main-btn" id="mainBtn" type="button"></button></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

function renderCal() {

  const first = new Date(y, mo - 1, 1), daysIn = new Date(y, mo, 0).getDate();
  const lead = (first.getDay() + 6) % 7;
  const maxMonth = iso(new Date(new Date().getFullYear(), new Date().getMonth() + 3, 1)).slice(0, 7);
  let cells = "";
  for (let i = 0; i < lead; i++) cells += "<span></span>";
  for (let d = 1; d <= daysIn; d++) {
    const day = `${y}-${pad(mo)}-${pad(d)}`;
    const past = day < TODAY, busy = !past && dayBusy(m.id, day);
    const cls = ["day"];
    if (busy) cls.push("busy");
    if (day === TODAY) cls.push("today");
    if (r.start && day === r.start) cls.push("start");
    if (r.end && day === r.end) cls.push("end");
    if (r.start && r.end && day > r.start && day < r.end) cls.push("in");
    if (r.start && !r.end && day === r.start) cls.push("end");
    cells += `<button type="button" class="${cls.join(" ")}" data-d="${day}" ${past ? "disabled" : ""} aria-label="${fmtDate(day)}${busy ? ", занято" : ""}">${d}</button>`;
  }
  const cal = $("cal");
  cal.innerHTML = `
    <div class="cal-head"><button type="button" id="prevM" aria-label="Предыдущий месяц" ${state.calMonth <= TODAY.slice(0, 7) ? "disabled" : ""}>‹</button>

      <button type="button" id="nextM" aria-label="Следующий месяц" ${state.calMonth >= maxMonth ? "disabled" : ""}>›</button></div>
    <div class="dow">${["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"].map(d => `<span>${d}</span>`).join("")}</div>
    <div class="days">${cells}</div>

  const shift = n => { const d = new Date(y, mo - 1 + n, 1); state.calMonth = iso(d).slice(0, 7); save(); renderCal(); };
  $("prevM").onclick = () => shift(-1); $("nextM").onclick = () => shift(1);

  updateCarFooter();
}

  if (!r.start || r.end || day <= r.start) {
    if (dayBusy(m.id, day)) { setHint("На эту дату все машины заняты.", true); return; }
    state.range = { start: day, end: null };
  } else {
    const err = rangeError(m.id, r.start, day);
    if (err) { setHint(err, true); return; }
    state.range = { start: r.start, end: day };
  }
  save(); renderCal();
}
function setHint(text, err) { const h = $("hint"); if (!h) return; h.textContent = text; h.className = "hint" + (err ? " err" : ""); }
function updateCarFooter() {
  const r = state.range, m = modelById(state.modelId);
  if (!r.start) { setHint("Выберите день получения машины."); mainButton("Выберите даты", null, true); return; }
  if (!r.end) { setHint("Получение " + fmtDate(r.start) + ". Теперь выберите день возврата."); mainButton("Выберите день возврата", null, true); return; }
  const n = diffDays(r.start, r.end), disc = discountFor(n);
  const base = Math.round(minPrice(m.id) * n * (100 - disc) / 100);
  setHint(fmtRange(r.start, r.end) + " · " + sutki(n) + (disc ? ` · скидка ${disc} %` : n < 3 ? " · от 3 суток скидка 5 %" : ""));
  mainButton(`Забронировать · ${rub(base)}`, () => go("book"));
}

// ----- клиент: заявка -----
function quote() {
  const m = modelById(state.modelId), r = state.range, f = state.form;
  const n = diffDays(r.start, r.end), full = minPrice(m.id) * n, disc = discountFor(n);
  const off = Math.round(full * disc / 100), base = full - off;
  const del = DELIVERY.find(d => d.id === f.delivery), delCost = deliveryCost(del, base);
  return { n, full, disc, off, base, del, delCost, deposit: rulesOf(m).deposit, total: base + delCost };
}
function renderBook(v) {
  const m = modelById(state.modelId), r = state.range, f = state.form, q = quote();
  v.innerHTML = `
    <h2>${esc(m.name)}</h2>
    <div class="hint">${fmtRange(r.start, r.end)} · ${sutki(q.n)}</div>
    <h3>Где получить</h3>
    <div class="seg" role="group" aria-label="Место получения">${DELIVERY.map(d => `<button type="button" data-del="${d.id}" aria-pressed="${f.delivery === d.id}">${d.name}<small>${d.cost ? "+" + rub(deliveryCost(d, q.base)) : d.note}</small></button>`).join("")}</div>
    <h3>Стоимость</h3>
    <div class="sum">
      <div class="row"><span>${rub(minPrice(m.id))} × ${sutki(q.n)}</span><span>${rub(q.full)}</span></div>
      ${q.disc ? `<div class="row"><span>Скидка за срок ${q.disc} %</span><span>−${rub(q.off)}</span></div>` : ""}
      <div class="row"><span>Подача: ${q.del.name.toLowerCase()}</span><span>${q.delCost ? rub(q.delCost) : "бесплатно"}</span></div>
      <div class="row"><span>Детское кресло</span><span>${f.seat ? "бесплатно" : "не нужно"}</span></div>
      <div class="row"><span>Пробег</span><span>${MILEAGE.perDay * q.n} км включено</span></div>
      <div class="row total"><span>Итого за аренду</span><span>${rub(q.total)}</span></div>
      <div class="row"><span>Залог при получении</span><span>${rub(q.deposit)}, вернём</span></div>
    </div>
    <h3>Контакты</h3>
    <form class="form" id="bookForm" novalidate>
      <div class="field"><label for="fName">Имя</label><input id="fName" autocomplete="name" value="${esc(f.name)}" placeholder="Как к вам обращаться"></div>
      <div class="field"><label for="fPhone">Телефон</label>
        <div class="tg-phone"><input id="fPhone" type="tel" autocomplete="tel" value="${esc(f.phone)}" placeholder="+7 900 000-00-00">
        <button type="button" id="tgPhone">Из Telegram</button></div></div>
      <label class="check"><input type="checkbox" id="fSeat" ${f.seat ? "checked" : ""}> Нужно детское кресло</label>
      <div class="field"><label for="fComment">Комментарий</label><textarea id="fComment" placeholder="Время получения, номер рейса и т. п.">${esc(f.comment)}</textarea></div>
      <label class="check"><input type="checkbox" id="fAge" ${f.age ? "checked" : ""}> Мне есть ${rulesOf(m).age} ${plural(rulesOf(m).age, "год", "года", "лет")}, стаж вождения от ${rulesOf(m).exp} ${plural(rulesOf(m).exp, "года", "лет", "лет")}</label>
      <label class="check"><input type="checkbox" id="fConsent" ${f.consent ? "checked" : ""}> Согласен на обработку персональных данных</label>
      <div class="err-text" id="formErr" role="alert"></div>
    </form>`;
  const bind = (id, key, prop = "value") => { const el = $(id); el.addEventListener(prop === "value" ? "input" : "change", () => { f[key] = el[prop]; save(); }); };
  bind("fName", "name"); bind("fPhone", "phone"); bind("fComment", "comment");
  bind("fAge", "age", "checked"); bind("fConsent", "consent", "checked");
  $("fSeat").onchange = e => { f.seat = e.target.checked; save(); renderBook(v); };
  v.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { f.delivery = b.dataset.del; save(); renderBook(v); });
  $("tgPhone").onclick = () => { f.phone = "+7 928 000-00-00"; save(); $("fPhone").value = f.phone; toast("Демо: Telegram передал номер"); };
  $("bookForm").onsubmit = e => { e.preventDefault(); submitBooking(); };
  mainButton(`Отправить заявку · ${rub(q.total)}`, submitBooking);
}
function submitBooking() {
  const f = state.form, err = $("formErr");
  const digits = f.phone.replace(/\D/g, "");
  const problem = !f.name.trim() ? "Укажите имя." : digits.length < 10 ? "Укажите телефон, чтобы менеджер мог перезвонить." :
    !f.age ? "Подтвердите возраст и стаж: без этого машину не выдадут." : !f.consent ? "Нужно согласие на обработку персональных данных." : "";
  if (problem) { err.textContent = problem; return; }
  const m = modelById(state.modelId), r = state.range;
  const recheck = rangeError(m.id, r.start, r.end);
  if (recheck) { err.textContent = recheck; return; }
  const q = quote();
  const bk = { id: state.nextId++, unit: null, model: m.id, start: r.start, end: r.end, status: "new", client: f.name.trim(), phone: f.phone.trim(),
    delivery: f.delivery, seat: f.seat, comment: f.comment.trim(), total: q.total, mine: true, demo: false, created: Date.now() };
  state.bookings.unshift(bk);
  state.lastCreated = bk.id;
  state.botQueue.unshift(bk.id);
  state.form = { ...f, comment: "" };
  go("done");
}
function renderDone(v) {
  const bk = state.bookings.find(b => b.id === state.lastCreated);
  const m = modelById(bk.model);
  v.innerHTML = `
    <div class="success"><div class="mark">✓</div><h2>Заявка №${bk.id} отправлена</h2>
      <p>${esc(m.name)}, ${fmtRange(bk.start, bk.end)}. Менеджер подтвердит бронь в этом чате. В рабочее время (${COMPANY.hours}) ответ обычно приходит за 15 минут.</p></div>
    <div class="sum"><div class="row"><span>Срок</span><span>${sutki(diffDays(bk.start, bk.end))}</span></div>
      <div class="row total"><span>Итого</span><span>${rub(bk.total)}</span></div></div>
    <p class="hint">Переключитесь в режим «Менеджер», чтобы увидеть, как заявка приходит сотруднику.</p>`;
  mainButton("Мои брони", () => go("mine"));
}
function renderMine(v) {
  const mine = state.bookings.filter(b => b.mine);
  v.innerHTML = `<h2>Мои брони</h2><div class="list">${mine.length ? mine.map(b => {
    const m = modelById(b.model);
    const canCancel = b.status === "new" || b.status === "confirmed";
    return `<div class="bk" data-s="${b.status}"><div class="bk-top"><div class="bk-title">${esc(m.name)}</div><span class="pill ${b.status}">${STATUS[b.status]}</span></div>
      <div class="bk-meta"><span>№${b.id} · ${fmtRange(b.start, b.end)} · ${sutki(diffDays(b.start, b.end))}</span><span>${rub(b.total || 0)}</span></div>
      ${canCancel ? `<div class="actions"><button class="btn danger" type="button" data-cancel="${b.id}">Отменить бронь</button></div>` : ""}</div>`;
  }).join("") : `<div class="empty">Броней пока нет. Выберите машину в каталоге.</div>`}</div>`;
  v.querySelectorAll("[data-cancel]").forEach(btn => btn.onclick = () => {
    const b = state.bookings.find(x => x.id === +btn.dataset.cancel);
    if (btn.dataset.armed) { b.status = "cancelled"; save(); toast("Бронь №" + b.id + " отменена"); renderMine(v); return; }
    btn.dataset.armed = "1"; btn.textContent = "Точно отменить?";
  });
  mainButton("В каталог", () => go("catalog"));
}

// ----- менеджер -----
function renderManager(v) {
  const tabs = [["requests", "Заявки"], ["board", "Шахматка"], ["fleet", "Автопарк"]];
  const active = state.bookings.filter(b => b.status === "issued").length;
  const freeToday = state.units.filter(u => unitFree(u, TODAY, addDays(TODAY, 1))).length;
  v.innerHTML = `
    <div class="stats"><div class="stat"><b>${newCount()}</b><span>новых заявок</span></div>
      <div class="stat"><b>${active}</b><span>машин в аренде</span></div>
      <div class="stat"><b>${freeToday}/${state.units.length}</b><span>свободно сегодня</span></div></div>
    <div class="tabs" role="group" aria-label="Разделы" style="margin-top:12px">${tabs.map(([id, n]) => `<button type="button" data-t="${id}" aria-pressed="${state.mgrTab === id}">${n}${id === "requests" && newCount() ? `<span class="count">${newCount()}</span>` : ""}</button>`).join("")}</div>
    <div id="mgrBody"></div>`;
  v.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { state.mgrTab = b.dataset.t; save(); renderManager(v); });
  const body = $("mgrBody");
  ({ requests: renderRequests, board: renderBoard, fleet: renderFleet }[state.mgrTab])(body, v);
  mainButton("");
}
function renderRequests(body, v) {
  const order = { new: 0, confirmed: 1, issued: 2, returned: 3, declined: 4, cancelled: 5 };
  const list = [...state.bookings].sort((a, b) => order[a.status] - order[b.status] || a.start.localeCompare(b.start));
  const botIds = state.botQueue.filter(id => state.bookings.find(b => b.id === id && b.status === "new"));
  const bot = botIds.length ? botIds.map(id => {
    const b = state.bookings.find(x => x.id === id), m = modelById(b.model), del = DELIVERY.find(d => d.id === b.delivery);
    return `<div class="botmsg"><div class="botmsg-head"><i></i>Бот Dadaev Car · сообщение менеджеру</div>
      <pre>🆕 Заявка №${b.id}
${m.name}
${fmtRange(b.start, b.end)} (${sutki(diffDays(b.start, b.end))})
Получение: ${del.name.toLowerCase()}${b.seat ? ", нужно детское кресло" : ""}
${b.client}, ${b.phone}${b.comment ? "\n«" + b.comment + "»" : ""}
Итого: ${rub(b.total || 0)}</pre>
      <div class="actions"><button class="btn primary" type="button" data-act="confirm" data-id="${b.id}">Подтвердить</button><button class="btn danger" type="button" data-act="decline" data-id="${b.id}">Отклонить</button></div></div>`;
  }).join("") : "";
  body.innerHTML = `${bot ? `<h3>Уведомления в Telegram</h3><div class="list">${bot}</div><h3>Все заявки</h3>` : ""}
    <div class="list">${list.map(b => {
      const m = modelById(b.model), u = b.unit ? unitById(b.unit) : null, del = DELIVERY.find(d => d.id === b.delivery);
      const acts = { new: [["confirm", "Подтвердить", "primary"], ["decline", "Отклонить", "danger"]], confirmed: [["issue", "Выдал машину", "primary"], ["cancel", "Отменить", "danger"]], issued: [["return", "Принял возврат", "primary"]] }[b.status] || [];
      return `<div class="bk" data-s="${b.status}"><div class="bk-top"><div class="bk-title">№${b.id} · ${esc(m.name)}</div><span class="pill ${b.status}">${STATUS[b.status]}</span></div>
        <div class="bk-meta"><span>${fmtRange(b.start, b.end)} · ${sutki(diffDays(b.start, b.end))} · ${del.name.toLowerCase()}</span>
          <span>${esc(b.client)}${b.demo ? " (демо)" : ""} · ${esc(b.phone)}</span>
          <span>${u ? "Машина: " + esc(u.label) : "Машина будет назначена при подтверждении"}</span></div>
        ${acts.length ? `<div class="actions">${acts.map(([a, t, c]) => `<button class="btn ${c}" type="button" data-act="${a}" data-id="${b.id}">${t}</button>`).join("")}</div>` : ""}</div>`;
    }).join("")}</div>`;
  body.querySelectorAll("[data-act]").forEach(btn => btn.onclick = () => act(btn.dataset.act, +btn.dataset.id, v));
}
function act(action, id, v) {
  const b = state.bookings.find(x => x.id === id);
  if (action === "confirm") {
    const free = freeUnits(b.model, b.start, b.end, b.id);
    if (!free.length) { toast("Нет свободной машины на эти даты. Отклоните заявку или освободите машину."); return; }
    b.unit = b.unit && free.some(u => u.id === b.unit) ? b.unit : free[0].id;
    b.status = "confirmed"; toast(`№${id} подтверждена · ${unitById(b.unit).label}. Клиенту ушло уведомление.`);
  } else if (action === "decline") { b.status = "declined"; toast(`№${id} отклонена. Клиенту ушло уведомление.`); }
  else if (action === "issue") { b.status = "issued"; toast(`№${id}: машина выдана`); }
  else if (action === "return") { b.status = "returned"; toast(`№${id}: машина возвращена`); }
  else if (action === "cancel") { b.status = "cancelled"; toast(`№${id} отменена`); }
  state.botQueue = state.botQueue.filter(x => x !== id || b.status === "new");
  save(); renderTop(); renderManager(v);
}
function renderBoard(body) {
  const DAYS = 14, days = Array.from({ length: DAYS }, (_, i) => addDays(TODAY, i));
  const head = days.map(d => { const dt = parse(d), we = dt.getDay() === 0 || dt.getDay() === 6;
    return `<th class="${we ? "we" : ""} ${d === TODAY ? "today" : ""}">${DOW[dt.getDay()]}<br>${dt.getDate()}</th>`; }).join("");
  const rows = state.units.map(u => {
    const m = modelById(u.model);
    const bks = state.bookings.filter(b => b.unit === u.id && ["confirmed", "issued"].includes(b.status));
    const pending = state.bookings.filter(b => !b.unit && b.status === "new" && b.model === u.model && freeUnits(u.model, b.start, b.end)[0]?.id === u.id);
    const cells = days.map(d => {
      if (u.repair) return `<td><div class="cell repair ${d === days[0] ? "s" : ""} ${d === days[DAYS - 1] ? "e" : ""}"></div></td>`;
      const b = bks.find(x => x.start <= d && d < x.end) || pending.find(x => x.start <= d && d < x.end);
      if (!b) return "<td></td>";
      const s = d === b.start ? "s" : "", e = addDays(d, 1) === b.end ? "e" : "";
      return `<td title="№${b.id} · ${esc(b.client)}"><div class="cell ${b.status} ${s} ${e}"></div></td>`;
    }).join("");
    return `<tr><th class="unit">${esc(u.label)}<small>${rub(u.price)}${u.repair ? " · ремонт" : ""}</small></th>${cells}</tr>`;
  }).join("");
  body.innerHTML = `<div class="board-wrap"><table class="board"><thead><tr><th class="unit">Машина</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>
    <div class="legend"><span><i style="background:var(--ok)"></i>Подтверждена</span><span><i style="background:var(--warn)"></i>Выдана</span>
      <span><i style="background:repeating-linear-gradient(45deg,var(--info) 0 3px,transparent 3px 6px)"></i>Новая заявка</span>
      <span><i style="background:repeating-linear-gradient(45deg,var(--muted) 0 3px,transparent 3px 6px)"></i>Ремонт</span></div>`;
}
function renderFleet(body, v) {
  body.innerHTML = `<div class="list">${state.units.map(u => {
    const m = modelById(u.model);
    const now = state.bookings.find(b => b.unit === u.id && b.status === "issued");
    return `<div class="fleet-item"><div class="ph">${m.photos[0] ? `<img src="img/${m.photos[0]}.jpg" alt="" loading="lazy">` : ""}</div>
      <div class="info"><b>${esc(m.name)}</b><span>${esc(u.label)} · ${u.repair ? "в ремонте" : now ? "в аренде до " + fmtDate(now.end) : "в парке"}</span>
        <label class="switch"><input type="checkbox" data-repair="${u.id}" ${u.repair ? "checked" : ""}> Ремонт</label></div>
      <label class="sr" style="display:grid;gap:2px;font-size:11px;color:var(--muted);text-align:right">₽/сутки<input class="price-input" id="price-${u.id}" inputmode="numeric" value="${u.price}" data-price="${u.id}"></label></div>`;
  }).join("")}</div>
  <p class="hint">Цены и статусы меняются сразу и видны клиентам в каталоге.</p>
  <button class="btn" type="button" id="resetDemo" style="margin-top:12px">Сбросить демо-данные</button>`;
  body.querySelectorAll("[data-repair]").forEach(c => c.onchange = () => { unitById(c.dataset.repair).repair = c.checked; save(); toast(c.checked ? "Машина снята с аренды" : "Машина снова доступна"); renderManager(v); });
  body.querySelectorAll("[data-price]").forEach(i => i.onchange = () => {
    const n = parseInt(i.value.replace(/\D/g, ""), 10);
    if (!n) { i.value = unitById(i.dataset.price).price; toast("Введите цену числом"); return; }
    unitById(i.dataset.price).price = n; save(); toast("Цена сохранена: " + rub(n));
  });
  $("resetDemo").onclick = e => {
    if (!e.target.dataset.armed) { e.target.dataset.armed = "1"; e.target.textContent = "Нажмите ещё раз, чтобы сбросить"; return; }
    state = freshState(); state.role = "manager"; state.screen = "mgr"; save(); render(); toast("Демо-данные восстановлены");
  };
}

render();
</script>
